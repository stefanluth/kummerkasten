name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNLOCK_PASSWORD: test
  DELETE_PASSWORD: test
  KUMMERKASTEN_POSTGRES_PRISMA_URL: postgresql://kummerkasten:kummerkasten@localhost:5432/kummerkasten
  KUMMERKASTEN_POSTGRES_URL_NON_POOLING: postgresql://kummerkasten:kummerkasten@localhost:5432/kummerkasten
  NEXT_TELEMETRY_DISABLED: '1'
  CI: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kummerkasten
          POSTGRES_PASSWORD: kummerkasten
          POSTGRES_DB: kummerkasten
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kummerkasten -d kummerkasten"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNLOCK_PASSWORD: test
  DELETE_PASSWORD: test
  SESSION_SECRET: test-session-secret-for-ci-only
  KUMMERKASTEN_POSTGRES_PRISMA_URL: postgresql://kummerkasten:kummerkasten@localhost:5432/kummerkasten
  KUMMERKASTEN_POSTGRES_URL_NON_POOLING: postgresql://kummerkasten:kummerkasten@localhost:5432/kummerkasten
  NEXT_TELEMETRY_DISABLED: '1'
  CI: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start production Docker image
        run: |
          docker compose -f docker-compose.e2e.yaml up --build --force-recreate --detach
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.e2e.yaml logs
          exit 1

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Stop production Docker image
        if: always()
        run: docker compose -f docker-compose.e2e.yaml down --volumes --remove-orphans

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
